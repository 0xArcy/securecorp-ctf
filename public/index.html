<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechShop - E-Commerce</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .hero {
      text-align: center;
      color: white;
    }
    .hero h1 {
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    .hero p {
      font-size: 1.2rem;
      margin-bottom: 40px;
      opacity: 0.95;
    }
    .btn-hero {
      padding: 12px 35px;
      font-size: 1rem;
      margin: 10px;
      border-radius: 8px;
      font-weight: 600;
      transition: transform 0.2s;
    }
    .btn-hero:hover {
      transform: scale(1.05);
    }
    .btn-primary-hero {
      background: white;
      color: #667eea;
    }
    .btn-secondary-hero {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 2px solid white;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div style="font-size: 5rem; margin-bottom: 20px;">🛍️</div>
    <h1>TechShop</h1>
    <p>Find the best tech products at great prices</p>
    <div>
      <a href="/dashboard" class="btn btn-hero btn-primary-hero">Browse Products</a>
      <a href="/login" class="btn btn-hero btn-secondary-hero">Login</a>
    </div>
  </div>
</body>
</html>
