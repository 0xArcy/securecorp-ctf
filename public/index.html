<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechShop — Best Tech, Best Prices</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .hero-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .hero { text-align: center; color: white; max-width: 640px; }
    .hero-icon {
      font-size: 5.5rem;
      margin-bottom: 1.2rem;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,.25));
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }
    .hero h1 {
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: .6rem;
      text-shadow: 0 2px 12px rgba(0,0,0,.2);
    }
    .hero p {
      font-size: 1.1rem;
      opacity: .9;
      margin-bottom: 2.4rem;
      line-height: 1.6;
    }
    .btn-hero {
      display: inline-block;
      padding: .8rem 2.2rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 14px;
      margin: .4rem;
      transition: transform .2s, box-shadow .2s;
      text-decoration: none;
    }
    .btn-hero:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,.25); }
    .btn-solid {
      background: white;
      color: #667eea;
    }
    .btn-outline {
      background: rgba(255,255,255,.12);
      color: white;
      border: 2px solid rgba(255,255,255,.5);
    }
    .btn-outline:hover { background: rgba(255,255,255,.22); color: white; }
    .stats {
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      flex-wrap: wrap;
      margin-top: 3rem;
      opacity: .8;
    }
    .stat { text-align: center; }
    .stat-num { font-size: 1.6rem; font-weight: 800; line-height: 1; }
    .stat-label { font-size: .78rem; opacity: .75; text-transform: uppercase; letter-spacing: .5px; margin-top: .2rem; }
    footer {
      text-align: center;
      color: rgba(255,255,255,.4);
      font-size: .78rem;
      padding: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="hero-wrapper">
    <div class="hero">
      <div class="hero-icon">🛍️</div>
      <h1>TechShop</h1>
      <p>Discover 30+ premium tech products at unbeatable prices.<br>Your one-stop shop for all things tech.</p>
      <div>
        <a href="/dashboard" class="btn-hero btn-solid">Browse Products</a>
        <a href="/login"     class="btn-hero btn-outline">Sign In</a>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-num">30+</div><div class="stat-label">Products</div></div>
        <div class="stat"><div class="stat-num">9</div><div class="stat-label">Categories</div></div>
        <div class="stat"><div class="stat-num">Free</div><div class="stat-label">Shipping</div></div>
      </div>
    </div>
  </div>
  <footer>TechShop · CTF Security Lab</footer>
</body>
</html>
