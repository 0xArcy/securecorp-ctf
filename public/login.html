<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — TechShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      overflow: hidden;
    }
    .card-top {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 2rem;
      text-align: center;
      color: white;
    }
    .card-top .logo { font-size: 2.5rem; margin-bottom: .4rem; }
    .card-top h4 { font-weight: 800; font-size: 1.4rem; margin: 0; letter-spacing: -.5px; }
    .card-top p { opacity: .8; font-size: .88rem; margin: .3rem 0 0; }
    .card-body { padding: 2rem; }
    .form-label { color: #555; font-weight: 600; font-size: .85rem; margin-bottom: .4rem; }
    .form-control {
      border: 2px solid #e4e4e7;
      border-radius: 10px;
      padding: .7rem 1rem;
      font-size: .95rem;
      transition: border-color .2s;
      margin-bottom: 1rem;
    }
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,.12);
      outline: none;
    }
    .btn-login {
      width: 100%;
      padding: .75rem;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin-top: .4rem;
      transition: transform .2s, box-shadow .2s;
      cursor: pointer;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102,126,234,.4);
    }
    .card-footer {
      background: #f9f9fb;
      padding: 1rem 2rem;
      text-align: center;
      border-top: 1px solid #f0f0f0;
    }
    .card-footer small { color: #aaa; font-size: .8rem; }
    .back-link { display: block; text-align: center; margin-top: 1.4rem; }
    .back-link a { color: rgba(255,255,255,.8); text-decoration: none; font-size: .88rem; font-weight: 600; transition: color .2s; }
    .back-link a:hover { color: white; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="card-top">
      <div class="logo">🛍️</div>
      <h4>TechShop</h4>
      <p>Sign in to your account</p>
    </div>
    <div class="card-body">
      <form method="POST" action="/login">
        <label class="form-label" for="username">Username</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required autocomplete="username">

        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">

        <button type="submit" class="btn-login">Sign In →</button>
      </form>
    </div>
    <div class="card-footer">
      <small>Demo accounts: <strong>alice</strong> / alice123 &nbsp;·&nbsp; <strong>bob</strong> / bob123</small>
    </div>
  </div>
  <div class="back-link">
    <a href="/">← Back to Home</a>
  </div>
</body>
</html>
