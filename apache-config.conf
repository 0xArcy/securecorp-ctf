<VirtualHost *:80>
    ServerName ecommerce-shop.local
    ServerAlias localhost

    # Proxy all traffic to Node.js server running on port 3000
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Enable necessary modules
    # Make sure these are enabled: a2enmod proxy, a2enmod proxy_http, a2enmod rewrite

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/ecommerce-error.log
    CustomLog ${APACHE_LOG_DIR}/ecommerce-access.log combined
</VirtualHost>
